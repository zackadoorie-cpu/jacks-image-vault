# One-shot release authorization for Phase 11C.
# Does not publish anything from this branch. The existing release.yml owns
# Windows, browser, security, patch and checksum validation.
name: Publish approved Phase 11C Filename Integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-phase11c-approved.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 11C Filename Integrity v2.1.39')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch fully verified v2.1.39 release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.39 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.39 already exists. No duplicate dispatch."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.39
          echo "Dispatched existing Windows, browser, security, patch and checksum release pipeline."
