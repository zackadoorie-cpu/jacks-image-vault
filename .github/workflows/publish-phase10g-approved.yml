# Publish only after full PR tests and approved merge.
name: Publish approved Phase 10G Filename Plan Import

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 10G Filename Plan Import v2.1.34 (#74)')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish complete v2.1.34 Windows release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.34 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.34 already exists; no duplicate dispatch."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.34
          echo "Dispatched full Windows build and versioned UI patch."
