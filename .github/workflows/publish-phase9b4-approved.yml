# One-time release gate for tested Phase 9B-4 Unified Library Desk.
# Keep all release.yml Windows/Chromium/update and checksum verification.
name: Publish approved Phase 9B-4 Unified Library Desk

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 9B-4 Unified Library Desk v2.1.27 (#67)')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch verified v2.1.27 release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.27 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.27 already exists; skipping duplicate dispatch."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.27
          echo "Requested full Windows desktop and UI patch release for v2.1.27."
