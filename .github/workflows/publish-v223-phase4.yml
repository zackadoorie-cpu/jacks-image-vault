# One-time publisher for the merged Phase 4 quick peek compare.
# Release build has independent Chromium, Windows, update security and checksums gates.
name: Publish v2.2.3 Phase 4 Quick Peek and Compare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v223-phase4.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: v2.2.3 Phase 4 quick peek compare')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify merged UI, source ancestry, and unused tag before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if gh release view v2.2.3 --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::v2.2.3 already published; no duplicate dispatch."
            exit 0
          fi
          if ! gh pr view 117 --repo "$REPO" --json state,mergedAt \
            --jq 'select(.state == "MERGED" and .mergedAt != null) | .mergedAt' | grep -q .; then
            echo "::error::UI Phase 4 PR #117 must be merged before v2.2.3 publication."
            exit 1
          fi
          STATUS="$(gh api "repos/$REPO/compare/058543bd2fe67171cb730fa79dc62cb69807201a...$GITHUB_SHA" --jq '.status')"
          if [[ "$STATUS" != "ahead" && "$STATUS" != "identical" ]]; then
            echo "::error::Release source does not include the verified Phase 4 merge."
            exit 1
          fi
          # Keep the dispatched release input derived from the same checked tag.
          RELEASE_VERSION=2.2.3
          gh workflow run release.yml --repo "$REPO" --ref main -f version="$RELEASE_VERSION"
          echo "Dispatched versioned v2.2.3 patch, EXE and desktop bundle with independent tests."
