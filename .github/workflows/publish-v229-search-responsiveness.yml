# One-time guarded publisher for verified Phase 9, v2.2.9.
name: Publish v2.2.9 Search Responsiveness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v229-search-responsiveness.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: v2.2.9 search responsiveness')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify Phase 9 merge and unused v2.2.9 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if gh release view v2.2.9 --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::v2.2.9 already published; no duplicate dispatch."
            exit 0
          fi
          if ! gh pr view 130 --repo "$REPO" --json state,mergedAt \
            --jq 'select(.state == "MERGED" and .mergedAt != null) | .mergedAt' | grep -q .; then
            echo "::error::Phase 9 PR #130 must be merged."
            exit 1
          fi
          STATUS="$(gh api "repos/$REPO/compare/ff7da72e417934abc45982ab918abf8f8bd98ef9...$GITHUB_SHA" --jq '.status')"
          if [[ "$STATUS" != "ahead" && "$STATUS" != "identical" ]]; then
            echo "::error::Release source lacks the verified Phase 9 merge."
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/v2.2.9" >/dev/null 2>&1; then
            echo "::error::Tag v2.2.9 already exists."
            exit 1
          fi
          gh workflow run release.yml --repo "$REPO" --ref main -f version=2.2.9
          echo "Dispatched independent v2.2.9 release validation."
