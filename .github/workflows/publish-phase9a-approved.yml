name: Publish approved Phase 9A Turbo Gallery release

# One-time, exact-message gate. This workflow does not create releases for
# ordinary future merges and does not bypass the full release.yml test gates.
on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 9A Turbo Gallery v2.1.19')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch checked, approved v2.1.19 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.19 already exists; no duplicate release dispatched."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.19
          echo "Requested the normal full-test Image Vault release workflow for v2.1.19."
