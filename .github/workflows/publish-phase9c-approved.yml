# One-time approved v2.1.23 release gate for Phase 9C.
# Release files are built and verified by the unchanged release.yml pipeline.
name: Publish approved Phase 9C Vault Pulse

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 9C Vault Pulse v2.1.23 (#63)')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch approved full release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.23 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.23 already exists; no duplicate release dispatched."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.23
          echo "Requested the normal full-test Image Vault release workflow for v2.1.23."
