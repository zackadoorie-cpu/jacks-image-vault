# One-time publisher for the merged Phase 1 UI makeover.
# Release build has independent Chromium, Windows, update security and checksums gates.
name: Publish v2.2.0 Phase 1 UI Makeover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v220-phase1.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: v2.2.0 Phase 1 UI makeover')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify merged UI, source ancestry, and unused tag before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if gh release view v2.2.0 --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::v2.2.0 already published; no duplicate dispatch."
            exit 0
          fi
          if ! gh pr view 110 --repo "$REPO" --json state,mergedAt \
            --jq 'select(.state == "MERGED" and .mergedAt != null) | .mergedAt' | grep -q .; then
            echo "::error::UI Phase 1 PR #110 must be merged before v2.2.0 publication."
            exit 1
          fi
          STATUS="$(gh api "repos/$REPO/compare/eb9d09fdc1ec97f28687c7833d5bcd6f2f3f1d0f...$GITHUB_SHA" --jq '.status')"
          if [[ "$STATUS" != "ahead" && "$STATUS" != "identical" ]]; then
            echo "::error::Release source does not include the verified Phase 1 merge."
            exit 1
          fi
          gh workflow run release.yml --repo "$REPO" --ref main -f version=2.2.0
          echo "Dispatched versioned v2.2.0 patch, EXE and desktop bundle with independent tests."
