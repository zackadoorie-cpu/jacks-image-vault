name: Validate Image Vault changes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go unit and security tests
        run: go test ./...
      - name: Check portable source bundle and JavaScript
        run: |
          node scripts/build-media-contract.cjs --check
          node --check web/app.js
      - name: Run Drive sync and media stress tests
        run: node --test tests/*.test.cjs
      - name: Check patch builder
        run: python3 -m py_compile make_patch.py
      - name: Ensure Windows build compiles
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/Jacks_Image_Vault.exe .
