name: Validate Image Vault changes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go unit and security tests
        run: go test ./...
      - name: Randomized ZIP fuzz and concurrent updater race detector
        run: |
          go test -race -run TestChaos -count=2 ./...
          go test -run '^
      - name: Check portable source bundle and JavaScript
        run: |
          node scripts/build-media-contract.cjs --check
          node scripts/build-search-engine.cjs --check
          node scripts/build-smart-collections.cjs --check
          node scripts/build-smart-controller.cjs --check
          node scripts/build-memory-lane.cjs --check
          node scripts/build-memory-controller.cjs --check
          node scripts/build-command-center.cjs --check
          node scripts/build-command-controller.cjs --check
          node scripts/build-review-inbox.cjs --check
          node scripts/build-review-inbox-controller.cjs --check
          node scripts/build-rename-desk.cjs --check
          node scripts/build-rename-desk-controller.cjs --check
          node scripts/build-video-library.cjs --check
          node scripts/build-video-controller.cjs --check
          node scripts/build-similarity-lab.cjs --check
          node scripts/build-similarity-controller.cjs --check
          node --check web/app.js
      - name: Run Drive sync and media stress tests
        run: node --test tests/*.test.cjs
      - name: Check patch builder and adversarial release artifact fixtures
        run: |
          python3 -m py_compile make_patch.py scripts/verify-release-assets.py
          python3 -m unittest discover -s tests -p 'test_verify_release_assets.py'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render and validate new PWA and Windows icon assets
        run: |
          python3 -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow>=11,<13"
          python3 scripts/render-brand-icons.py --ico build/Jacks_Image_Vault.ico
          python3 - <<'PY'
          from PIL import Image
          for name, size in [('icon-180.png',180),('icon-192.png',192),
                             ('icon-512.png',512),('icon-maskable-512.png',512)]:
              with Image.open('web/icons/'+name) as im:
                  assert im.size == (size,size), name
          with Image.open('build/Jacks_Image_Vault.ico') as im:
              assert im.format == 'ICO'
              assert (256,256) in im.info['sizes']
          PY
      - name: Ensure Windows build embeds app icon and compiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64
          x86_64-w64-mingw32-windres --preprocessor=cpp -i scripts/vault-icon.rc -o vault-icon.syso -O coff
          test -s vault-icon.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/Jacks_Image_Vault.exe .
          test -s /tmp/Jacks_Image_Vault.exe

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows media, cancellation and similarity regressions
        shell: pwsh
        run: node --test tests/video-library.test.cjs tests/similarity-lab.test.cjs tests/stress.test.cjs
      - name: Windows launcher identity and shortcut hardening tests
        shell: pwsh
        run: go test -run 'Test(WindowsInstall|WindowsSetup|ChaosNative|ChaosDecimal|WindowsIntegrationEndpoints)' ./...
      - name: Build native Image Vault for Windows
        shell: pwsh
        run: go build -o "${{ runner.temp }}/Jacks_Image_Vault_smoke.exe" .
      - name: Launch real Windows EXE and verify both views
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -ExecutablePath "${{ runner.temp }}/Jacks_Image_Vault_smoke.exe"
      - name: Upgrade native EXE with fabricated ZIP, restart and rollback
        shell: pwsh
        run: ./scripts/windows-upgrade-smoke.ps1 -ExecutablePath "${{ runner.temp }}/Jacks_Image_Vault_smoke.exe"

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run fabricated Google Sheets and Drive browser smoke
        run: node tests/browser-e2e.cjs
 -fuzz '^FuzzParseZip
      - name: Check portable source bundle and JavaScript
        run: |
          node scripts/build-media-contract.cjs --check
          node scripts/build-search-engine.cjs --check
          node scripts/build-smart-collections.cjs --check
