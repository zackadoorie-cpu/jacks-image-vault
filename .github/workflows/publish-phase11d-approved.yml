# One-shot authorized release dispatch for Phase 11D.
# No patch is published until the existing release.yml verifies all artifacts.
name: Publish approved Phase 11D Recovery Desk

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-phase11d-approved.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 11D Recovery Desk v2.1.40')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch verified v2.1.40 exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.40 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.40 already exists. No duplicate dispatch."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.40
          echo "Dispatched normal independent Windows, browser, security and checksum release gates."
