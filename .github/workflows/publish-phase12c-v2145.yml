# Owner-authorized, one-shot native streaming release.
# v2.1.45 must ship the new Go EXE and Desktop Bundle, not just a UI patch.
name: Publish Phase 12C v2.1.45

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-phase12c-v2145.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 12C v2.1.45')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Release only the tested, merged native streaming source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.45 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.45 already exists. Not dispatching twice."
            exit 0
          fi
          if ! gh pr view 98 --repo "$GITHUB_REPOSITORY" --json state,mergedAt --jq 'select(.state == "MERGED" and .mergedAt != null) | .mergedAt' | grep -q .; then
            echo "::error::Feature PR #98 is not merged. Publishing is blocked."
            exit 1
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.45
          echo "Independent Windows native EXE, WebView2 bundle, browser, stress and SHA-256 release checks dispatched."
