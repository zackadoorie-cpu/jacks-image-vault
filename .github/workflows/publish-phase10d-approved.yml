# Phase 10D reuses the existing temporary Sheets authorization; no new OAuth endpoint.
# Canonical release.yml publishes both the self-contained Windows bundle and UI patch.
name: Publish approved Phase 10D Filename Reconciliation

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 10D Filename Reconciliation v2.1.31 (#71)')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish complete v2.1.31 Windows release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.31 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.31 already exists; no duplicate dispatch."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.31
          echo "Dispatched full native Windows desktop release and checksums."
