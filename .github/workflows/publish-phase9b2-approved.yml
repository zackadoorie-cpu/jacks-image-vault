name: Publish approved Phase 9B-2 Windows reconnect and Sheet Approvals

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 9B-2 Sheet Approvals and Windows Login v2.1.22')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch one approved full release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.22 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v2.1.22 already exists."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.22
          echo "Dispatched the full checked v2.1.22 release pipeline."
