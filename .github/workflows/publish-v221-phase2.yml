# One-time publisher for the merged Phase 2 gallery polish.
# Release build has independent Chromium, Windows, update security and checksums gates.
name: Publish v2.2.1 Phase 2 Gallery Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v221-phase2.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: v2.2.1 Phase 2 gallery polish')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify merged UI, source ancestry, and unused tag before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          if gh release view v2.2.1 --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::v2.2.1 already published; no duplicate dispatch."
            exit 0
          fi
          if ! gh pr view 112 --repo "$REPO" --json state,mergedAt \
            --jq 'select(.state == "MERGED" and .mergedAt != null) | .mergedAt' | grep -q .; then
            echo "::error::UI Phase 2 PR #112 must be merged before v2.2.1 publication."
            exit 1
          fi
          STATUS="$(gh api "repos/$REPO/compare/5c6a52708799153f1f66e16552796bea8c0e586a...$GITHUB_SHA" --jq '.status')"
          if [[ "$STATUS" != "ahead" && "$STATUS" != "identical" ]]; then
            echo "::error::Release source does not include the verified Phase 2 merge."
            exit 1
          fi
          # Keep the dispatched release input derived from the same checked tag.
          RELEASE_VERSION=2.2.1
          gh workflow run release.yml --repo "$REPO" --ref main -f version="$RELEASE_VERSION"
          echo "Dispatched versioned v2.2.1 patch, EXE and desktop bundle with independent tests."
