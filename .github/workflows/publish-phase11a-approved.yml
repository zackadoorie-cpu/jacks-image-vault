# One-shot authorized Phase 11A release dispatcher.
# The existing release.yml pipeline remains the only publisher of EXE, patch,
# desktop bundle and checksums. It runs its own release tests and asset gates.
name: Publish approved Phase 11A Self-Healing Catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-phase11a-approved.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.repository == 'zackadoorie-cpu/jacks-image-vault' &&
      startsWith(github.event.head_commit.message, 'release: Phase 11A Self-Healing Catalog v2.1.37')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing full verified v2.1.37 release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.37 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.37 already exists; no duplicate dispatch."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=2.1.37
          echo "Dispatched the full Windows, browser, and security release pipeline."
