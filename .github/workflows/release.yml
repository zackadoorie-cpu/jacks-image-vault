name: Build and publish Image Vault update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "NEW unused version higher than latest, e.g. 2.1.1 (no v or trailing dot)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: image-vault-release
  cancel-in-progress: false

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for synthetic browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate no-auth Google Drive and Sheets browser experience
        run: node tests/browser-e2e.cjs

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows updater, release fallback and security tests
        shell: pwsh
        run: go test ./...
      - name: Windows storyboard and Drive regression tests
        shell: pwsh
        run: node --test tests/video-library.test.cjs tests/similarity-lab.test.cjs tests/stress.test.cjs tests/updater-recovery.test.cjs
      - name: Test shortcut transaction rollback and crash recovery in sandbox
        shell: pwsh
        run: ./scripts/windows-shortcut-transaction-smoke.ps1
      - name: Build and smoke-test optional WebView2 desktop host
        shell: pwsh
        run: ./scripts/windows-desktop-host-smoke.ps1
      - name: Upload verified native desktop host for release packaging
        uses: actions/upload-artifact@v4
        with:
          name: jacks-vault-webview2-host
          path: ${{ runner.temp }}/JacksDesktopBuild/Jacks_Image_Vault_Desktop.exe
          if-no-files-found: error
          retention-days: 2
      - name: Build native Windows Image Vault
        shell: pwsh
        run: go build -o "${{ runner.temp }}/Jacks_Image_Vault_smoke.exe" .
      - name: Start EXE and verify private loopback UI
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -ExecutablePath "${{ runner.temp }}/Jacks_Image_Vault_smoke.exe"
      - name: Upgrade native EXE with fabricated ZIP, restart and rollback
        shell: pwsh
        run: ./scripts/windows-upgrade-smoke.ps1 -ExecutablePath "${{ runner.temp }}/Jacks_Image_Vault_smoke.exe"

  release:
    if: github.ref == 'refs/heads/main'
    needs: [browser-e2e, windows-smoke]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate new release version before building
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version '$RELEASE_VERSION'. Use three numbers like 2.1.1 (no leading v, spaces, or trailing dot)."
            exit 1
          fi
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Releases cannot be republished under the same tag. Choose a new version."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::The Git tag $TAG already exists even if its release was deleted. Choose a new version."
            exit 1
          fi
          LATEST="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
             [[ "$(printf '%s\n' "$RELEASE_VERSION" "${LATEST#v}" | sort -V | tail -n 1)" != "$RELEASE_VERSION" ]]; then
            echo "::error::Version $RELEASE_VERSION is older than latest published $LATEST. Choose a higher number."
            exit 1
          fi
          echo "### Release preflight passed" >> "$GITHUB_STEP_SUMMARY"
          printf 'Requested release: %s\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
          printf 'Latest published release: %s\n' "${LATEST:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run updater security tests
        run: go test -v ./...
      - name: Run Drive sync and media stress tests
        run: node --test tests/*.test.cjs
      - name: Check JavaScript and patch builder
        run: |
          node scripts/build-media-contract.cjs --check
          node scripts/build-search-engine.cjs --check
          node scripts/build-smart-collections.cjs --check
          node scripts/build-smart-controller.cjs --check
          node scripts/build-memory-lane.cjs --check
          node scripts/build-memory-controller.cjs --check
          node scripts/build-command-center.cjs --check
          node scripts/build-command-controller.cjs --check
          node scripts/build-review-inbox.cjs --check
          node scripts/build-review-inbox-controller.cjs --check
          node scripts/build-rename-desk.cjs --check
          node scripts/build-rename-desk-controller.cjs --check
          node scripts/build-video-library.cjs --check
          node scripts/build-video-controller.cjs --check
          node scripts/build-similarity-lab.cjs --check
          node scripts/build-similarity-controller.cjs --check
          node --check web/app.js
          python3 -m py_compile make_patch.py scripts/verify-release-assets.py
          python3 -m unittest discover -s tests -p 'test_verify_release_assets.py'
      - name: Render branded app icons and embed Windows EXE icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow>=11,<13"
          python3 scripts/render-brand-icons.py --ico build/Jacks_Image_Vault.ico
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64
          x86_64-w64-mingw32-windres --preprocessor=cpp -i scripts/vault-icon.rc -o vault-icon.syso -O coff
          test -s vault-icon.syso
      - name: Build unsigned Windows EXE and versioned UI patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H windowsgui -s -w -X main.builtinVersion=${RELEASE_VERSION}" -o "dist/Jacks_Image_Vault_${RELEASE_VERSION}.exe" .
          python3 make_patch.py --version "$RELEASE_VERSION" --web web --output dist/jacks-image-vault-patch.zip --notes "UI update from GitHub release v${RELEASE_VERSION}"
      - name: Download verified Windows Desktop host
        uses: actions/download-artifact@v4
        with:
          name: jacks-vault-webview2-host
          path: desktop-host-artifact
      - name: Package optional self-contained desktop bundle and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s desktop-host-artifact/Jacks_Image_Vault_Desktop.exe
          python3 scripts/build-desktop-bundle.py \
            --version "$RELEASE_VERSION" \
            --server "dist/Jacks_Image_Vault_${RELEASE_VERSION}.exe" \
            --host desktop-host-artifact/Jacks_Image_Vault_Desktop.exe \
            --output "dist/Jacks_Image_Vault_Desktop_Bundle_v${RELEASE_VERSION}.zip"
          (cd dist && sha256sum Jacks_Image_Vault_*.exe jacks-image-vault-patch.zip Jacks_Image_Vault_Desktop_Bundle_v*.zip > SHA256SUMS.txt)
      - name: Verify EXE, ZIP manifest allowlist, and public checksums
        shell: bash
        run: python3 scripts/verify-release-assets.py --version "$RELEASE_VERSION" --dist dist
      - name: Publish GitHub release with updater asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new version." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Jack's Image Vault $TAG" \
            --generate-notes
