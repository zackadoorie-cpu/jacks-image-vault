name: Build and publish Image Vault update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 2.0.1)"
        required: true
        default: "2.0.1"
        type: string

permissions:
  contents: write

concurrency:
  group: image-vault-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be like 2.0.1" >&2
            exit 1
          fi
      - name: Run updater security tests
        run: go test -v ./...
      - name: Check JavaScript and patch builder
        run: |
          node --check web/app.js
          python3 -m py_compile make_patch.py
      - name: Build unsigned Windows EXE and versioned UI patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H windowsgui -s -w -X main.builtinVersion=${RELEASE_VERSION}" -o "dist/Jacks_Image_Vault_${RELEASE_VERSION}.exe" .
          python3 make_patch.py --version "$RELEASE_VERSION" --web web --output dist/jacks-image-vault-patch.zip --notes "UI update from GitHub release v${RELEASE_VERSION}"
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub release with updater asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new version." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Jack's Image Vault $TAG" \
            --generate-notes
